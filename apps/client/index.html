<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imperio del Nya - Tower Defense</title>
  <style>
    :root {
      --primary-color: #bb86fc;
      --bg-color: #121212;
      --surface-color: rgba(30, 30, 30, 0.85);
      --text-color: #ffffff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 250px;
      width: calc(100vw - 500px);
      z-index: 1;
      background: #09090b;
    }
    
    /* Panel de UI Lateral Derecho (Glassmorphism) */
    #ui-panel {
      position: absolute;
      top: 20px;
      right: -320px; /* Oculto por defecto */
      width: 220px;
      background: var(--surface-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 10;
      transition: right 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    /* Barra Superior de Herramientas (Test Mode) */
    #test-toolbar {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--surface-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      width: 220px;
      box-sizing: border-box;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .tool-btn.active {
      background: var(--primary-color);
      color: var(--bg-color);
      border-color: var(--primary-color);
      box-shadow: 0 0 10px var(--primary-color);
    }

    #char-select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      max-width: 0;
      opacity: 0;
      transition: max-width 0.3s ease, opacity 0.3s ease;
    }
    
    #char-select-wrapper.visible {
      max-width: 220px;
      opacity: 1;
      display: grid;
      gap: 7px;
    }

    #char-select {
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: white;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      white-space: nowrap;
      width: 100%;
    }
    
    #char-select:focus {
      border-color: var(--primary-color);
    }

    .config-label { color: #888; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    
    #ui-panel.active {
      right: 20px; /* Visible */
      top: 315px;
    }

    #ui-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
      color: var(--primary-color);
    }

    #test-toolbar::before { content: 'DESPLIEGUE'; color: #888; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.16em; }

    .form-group {
      margin-top: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #ccc;
    }

    select {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary-color);
    }
    
    #close-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #close-panel:hover {
      color: white;
    }

    #remove-tower {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      border: 1px solid #ef5350;
      border-radius: 6px;
      background: rgba(239, 83, 80, 0.15);
      color: #ff8a80;
      cursor: pointer;
      font-weight: bold;
    }

    #remove-tower:hover {
      background: rgba(239, 83, 80, 0.3);
    }

    #tower-limit {
      margin: 0;
      color: #aaa;
      font-size: 0.75rem;
      text-align: center;
    }

    #tower-price {
      margin: 0;
      color: #fcd34d;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
    }

    #game-status {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 220px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(35, 35, 45, 0.94), rgba(20, 20, 25, 0.92));
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .hud-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; color: #aaa; font-size: 0.68rem; font-weight: bold; letter-spacing: 0.14em; text-transform: uppercase; }
    #game-state { color: #a7f3d0; letter-spacing: 0; }
    .hud-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hud-card { padding: 9px 10px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 9px; background: rgba(255, 255, 255, 0.045); }
    .hud-card.wide { grid-column: 1 / -1; }
    .hud-card-label { display: block; margin-bottom: 3px; color: #888; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .hud-value { color: #f4f4f5; font-size: 0.95rem; font-weight: 700; }
    #coin-status { color: #fcd34d; }
    .coin-card { border-color: rgba(252, 211, 77, 0.28); background: linear-gradient(135deg, rgba(120, 85, 10, 0.28), rgba(255, 255, 255, 0.045)); }
    .coin-value { display: flex; align-items: center; gap: 8px; color: #fef08a; font-size: 1.45rem; }
    .coin-icon { display: inline-grid; width: 25px; height: 25px; place-items: center; border: 2px solid #facc15; border-radius: 50%; color: #facc15; font-size: 0.8rem; }
    #enemy-status { color: #fca5a5; }
    .progress-track { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 10px; background: rgba(0, 0, 0, 0.4); }
    .progress-fill { width: 100%; height: 100%; border-radius: inherit; transition: width 0.25s ease; }
    #wave-progress { background: #a78bfa; }
    #gem-progress { background: #22d3ee; }
    #hud-toggle { padding: 3px 7px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 5px; background: rgba(255, 255, 255, 0.08); color: #ddd; cursor: pointer; font-size: 0.65rem; letter-spacing: 0; text-transform: none; }
    #game-status.collapsed { width: auto; padding: 9px 11px; }
    #game-status.collapsed .hud-header { margin-bottom: 0; }
    #game-status.collapsed .hud-grid, #game-status.collapsed #wave-button { display: none; }

    #wave-button {
      width: 100%;
      margin-top: 6px;
      padding: 5px 9px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      cursor: pointer;
    }

    #skill-status { display: grid; gap: 7px; }
    .skill-card { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 7px; background: rgba(255, 255, 255, 0.045); font-size: 0.78rem; }
    .skill-card.passive { border-left: 3px solid #a78bfa; }
    .skill-card.ready { border-left: 3px solid #4ade80; }
    .skill-card.cooldown { border-left: 3px solid #64748b; color: #94a3b8; }
    .skill-state { white-space: nowrap; color: #86efac; font-size: 0.7rem; font-weight: bold; }
    .cooldown .skill-state { color: #94a3b8; }

    #end-screen { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(5, 5, 8, 0.78); backdrop-filter: blur(8px); }
    #end-screen.visible { display: grid; }
    .end-card { width: min(390px, calc(100vw - 32px)); padding: 32px 24px; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 18px; background: #1b1b23; text-align: center; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5); }
    #end-title { margin: 0 0 8px; color: #f4f4f5; font-size: 2rem; }
    #end-message { margin: 0 0 22px; color: #a1a1aa; }
    #restart-button { padding: 11px 22px; border: 0; border-radius: 8px; background: var(--primary-color); color: #17121f; cursor: pointer; font-weight: 700; }

    @media (max-width: 700px) {
      #game-container { left: 0; width: 100vw; }
      #game-status { top: 10px; left: 10px; width: 205px; padding: 10px; }
      #test-toolbar { top: auto; bottom: 10px; right: 10px; left: 10px; width: calc(100vw - 20px); padding: 7px 10px; gap: 6px; flex-direction: row; flex-wrap: wrap; justify-content: center; box-sizing: border-box; }
      .tool-btn { min-height: 38px; padding: 7px 9px; font-size: 0.75rem; }
      #char-select-wrapper.visible { max-width: 100%; flex-basis: 100%; order: 3; justify-content: center; }
      #char-select { width: min(100%, 260px); min-height: 38px; }
      #ui-panel { top: auto; right: 10px; bottom: 65px; width: min(290px, calc(100vw - 20px)); }
      #ui-panel.active { top: auto; }
    }

    @media (min-width: 701px) and (max-width: 1100px) {
      #game-container { left: 230px; width: calc(100vw - 460px); }
      #game-status { left: 12px; width: 195px; }
      #test-toolbar { right: 12px; width: 195px; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="game-status">
    <div class="hud-header"><span>Imperio del Nya</span><span id="game-state">EN JUEGO</span><button id="hud-toggle">Ocultar</button></div>
    <div class="hud-grid">
      <div class="hud-card wide"><span class="hud-card-label">Oleada</span><span class="hud-value" id="wave-status">0 / 5</span><div class="progress-track"><div class="progress-fill" id="wave-progress"></div></div></div>
      <div class="hud-card"><span class="hud-card-label">Joyas</span><span class="hud-value" id="gem-status">3 / 3</span><div class="progress-track"><div class="progress-fill" id="gem-progress"></div></div></div>
      <div class="hud-card"><span class="hud-card-label">Amenazas</span><span class="hud-value" id="enemy-status">0</span></div>
      <div class="hud-card wide coin-card"><span class="hud-card-label">Recursos disponibles</span><span class="coin-value"><span class="coin-icon">N</span><span id="coin-status">500</span></span></div>
    </div>
    <button id="wave-button">Pausar</button>
  </div>
  
  <div id="test-toolbar">
    <button class="tool-btn active" data-tool="tower">🗼 Torre</button>
    <div id="char-select-wrapper" class="visible">
      <select id="char-select">
        <option value="angel">👑 Angel (SSR) · 250</option>
        <option value="tribu">🐱 Tribu (SSR) · 250</option>
        <option value="gretch">🌸 Gretch (SSR) · 250</option>
        <option value="kiu">🎯 Kiu (SR) · 150</option>
        <option value="lucy">🦋 Lucy (SR) · 150</option>
        <option value="cesar">⚔️ Cesar (R) · 75</option>
      </select>
      <p id="tower-price">Coste: 250 monedas</p>
      <p id="tower-limit">Angel: 0/1</p>
      <label class="config-label" for="difficulty-select">Dificultad</label>
      <select id="difficulty-select">
        <option value="0.85">Tranquila</option>
        <option value="1" selected>Normal</option>
        <option value="1.25">Asedio</option>
      </select>
      <label class="config-label" for="wave-duration">Tiempo entre oleadas</label>
      <select id="wave-duration">
        <option value="5000">5 segundos</option>
        <option value="8000" selected>8 segundos</option>
        <option value="12000">12 segundos</option>
      </select>
    </div>
  </div>

  <div id="ui-panel">
    <button id="close-panel">✕</button>
    <h2 id="tower-name">Nombre Torre</h2>
    <p style="font-size: 0.85rem; color: #aaa;" id="tower-role">Rol / Stats</p>
    
    <div class="form-group">
      <label for="targeting-select">Prioridad de Ataque (Targeting):</label>
      <select id="targeting-select">
        <option value="CLOSEST_TO_CORE">Más cerca del centro (Defecto)</option>
        <option value="CLOSEST_TO_TOWER">Más cerca de la torre</option>
        <option value="FARTHEST_FROM_CORE">Más lejos del centro</option>
        <option value="HIGHEST_HP">Más vida (Fuerte)</option>
        <option value="LOWEST_HP">Menos vida (Débil)</option>
        <option value="FASTEST">Más rápido</option>
      </select>
    </div>
    <div class="form-group">
      <label>Habilidades</label>
      <div id="skill-status">Selecciona una torre</div>
    </div>
    <button id="remove-tower">Quitar torre</button>
  </div>
  <div id="end-screen">
    <div class="end-card">
      <h1 id="end-title">Fin de la partida</h1>
      <p id="end-message"></p>
      <button id="restart-button">Reiniciar partida</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
