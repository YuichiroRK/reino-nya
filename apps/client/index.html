<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imperio del Nya - Tower Defense</title>
  <style>
    :root {
      --primary-color: #bb86fc;
      --bg-color: #121212;
      --surface-color: rgba(30, 30, 30, 0.85);
      --text-color: #ffffff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    /* Panel de UI Lateral Derecho (Glassmorphism) */
    #ui-panel {
      position: absolute;
      top: 20px;
      right: -320px; /* Oculto por defecto */
      width: 280px;
      background: var(--surface-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 10;
      transition: right 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    /* Barra Superior de Herramientas (Test Mode) */
    #test-toolbar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .tool-btn.active {
      background: var(--primary-color);
      color: var(--bg-color);
      border-color: var(--primary-color);
      box-shadow: 0 0 10px var(--primary-color);
    }

    #char-select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      max-width: 0;
      opacity: 0;
      transition: max-width 0.3s ease, opacity 0.3s ease;
    }
    
    #char-select-wrapper.visible {
      max-width: 220px;
      opacity: 1;
    }

    #char-select {
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: white;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      white-space: nowrap;
    }
    
    #char-select:focus {
      border-color: var(--primary-color);
    }
    
    #ui-panel.active {
      right: 20px; /* Visible */
    }

    #ui-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
      color: var(--primary-color);
    }

    .form-group {
      margin-top: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #ccc;
    }

    select {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary-color);
    }
    
    #close-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #close-panel:hover {
      color: white;
    }

    #remove-tower {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      border: 1px solid #ef5350;
      border-radius: 6px;
      background: rgba(239, 83, 80, 0.15);
      color: #ff8a80;
      cursor: pointer;
      font-weight: bold;
    }

    #remove-tower:hover {
      background: rgba(239, 83, 80, 0.3);
    }

    #tower-limit {
      margin: 0;
      color: #aaa;
      font-size: 0.75rem;
      text-align: center;
    }

    #game-status {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--surface-color);
      font-size: 0.85rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="game-status">
    <div id="wave-status">Oleada: 0/5</div>
    <div id="gem-status">Joyas: 3/3</div>
  </div>
  
  <div id="test-toolbar">
    <button class="tool-btn active" data-tool="tower">🗼 Torre</button>
    <div id="char-select-wrapper" class="visible">
      <select id="char-select">
        <option value="angel">👑 Angel (SSR)</option>
        <option value="tribu">🐱 Tribu (SSR)</option>
        <option value="gretch">🌸 Gretch (SSR)</option>
        <option value="kiu">🎯 Kiu (SR)</option>
        <option value="lucy">🦋 Lucy (SR)</option>
        <option value="cesar">⚔️ Cesar (R)</option>
      </select>
      <p id="tower-limit">Torres: 0/6</p>
    </div>
    <button class="tool-btn" data-tool="wall">🧱 Muro</button>
  </div>

  <div id="ui-panel">
    <button id="close-panel">✕</button>
    <h2 id="tower-name">Nombre Torre</h2>
    <p style="font-size: 0.85rem; color: #aaa;" id="tower-role">Rol / Stats</p>
    
    <div class="form-group">
      <label for="targeting-select">Prioridad de Ataque (Targeting):</label>
      <select id="targeting-select">
        <option value="CLOSEST_TO_CORE">Más cerca del centro (Defecto)</option>
        <option value="CLOSEST_TO_TOWER">Más cerca de la torre</option>
        <option value="FARTHEST_FROM_CORE">Más lejos del centro</option>
        <option value="HIGHEST_HP">Más vida (Fuerte)</option>
        <option value="LOWEST_HP">Menos vida (Débil)</option>
        <option value="FASTEST">Más rápido</option>
      </select>
    </div>
    <button id="remove-tower">Quitar torre</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
